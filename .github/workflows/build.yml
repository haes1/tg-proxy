name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Insert API keys and proxy list URL
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          PROXY_LIST_URL: ${{ vars.PROXY_LIST_URL }}
        run: |
          FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            # Temporary: builds with the official keys from BuildVars until own keys are added.
            echo "::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set, using the official keys from BuildVars. Get your own at https://my.telegram.org"
          else
            if ! [[ "$API_ID" =~ ^[0-9]+$ ]] || ! [[ "$API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
              echo "::error::TELEGRAM_API_ID must be a number and TELEGRAM_API_HASH 32 hex characters"
              exit 1
            fi
            sed -i -E "s/(public static int APP_ID = )[0-9]+;/\1$API_ID;/" "$FILE"
            sed -i -E "s/(public static String APP_HASH = )\"[0-9a-f]+\";/\1\"$API_HASH\";/" "$FILE"
          fi
          if [ -n "$PROXY_LIST_URL" ]; then
            if ! [[ "$PROXY_LIST_URL" =~ ^https?://[^\"\\]+$ ]]; then
              echo "::error::PROXY_LIST_URL must start with http:// or https://"
              exit 1
            fi
            URL_ESCAPED=$(printf '%s' "$PROXY_LIST_URL" | sed 's/[&|]/\\&/g')
            sed -i -E "s|(public static String PROXY_LIST_URL = )\"[^\"]*\";|\1\"$URL_ESCAPED\";|" "$FILE"
          fi
          grep -n "APP_ID =\|PROXY_LIST_URL =" "$FILE"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: native-arm64
          max-size: 2G

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          USE_CCACHE: '1'
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n 1)" out/Telezhka-${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Telezhka-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: APK для установки на Android. Скачайте файл .apk ниже.
          files: out/*.apk
