name: Channel posts

# Every 30 minutes: copy the latest posts of @teleskaoff into the site (gh-pages/channel/),
# so the site shows them without loading anything from Telegram.
on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: channel-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: main

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Copy posts from the channel
        run: python3 main/.github/scripts/channel_posts.py site

      - name: Commit if changed
        working-directory: site
        run: |
          git add -A channel
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Channel posts"
          git push
