const KEYS = OUTLINE.map((k, i) => {
  if (k) return k;
  let j = i;
  while (!OUTLINE[j]) j += i < OUTLINE.length / 2 ? 1 : -1;
  const [xL, xR, , bot] = OUTLINE[j];
  return [xL, xR, bot.slice(), bot];
});

function outlineAt(fr) {
  const f = clamp(fr / 3, 0, KEYS.length - 1);
  const i = Math.min(Math.floor(f), KEYS.length - 2), k = f - i;
  const A = KEYS[i], B = KEYS[i + 1];
  const xL = lerp(A[0], B[0], k), xR = lerp(A[1], B[1], k);
  const top = [], bot = [];
  for (let u = 0; u < US.length; u++) {
    const x = xL + (xR - xL) * US[u];
    top.push([x, lerp(A[2][u], B[2][u], k)]);
    bot.push([x, lerp(A[3][u], B[3][u], k)]);
  }
  return { top, bot };
}

// сглаженная кривая через точки (Catmull-Rom -> Безье)
function curve(pts, closed) {
  const p = i => pts[closed ? (i + pts.length) % pts.length : clamp(i, 0, pts.length - 1)];
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  const last = closed ? pts.length : pts.length - 1;
  for (let i = 0; i < last; i++) {
    const p0 = p(i - 1), p1 = p(i), p2 = p(i + 1), p3 = p(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return closed ? d + "Z" : d;
}

// риннеган: 11 колец; m=0 — концентрические, m=1 — сливаются в спираль
const RINGS = 11;
const ringEls = [];
for (let k = 0; k < RINGS; k++)
  ringEls.push(el("path", { fill: "none", stroke: "#6a2444", "stroke-width": 1.1 }, $("rings")));
function drawRings(m) {
  ringEls.forEach((p, k) => {
    let d = "";
    for (let s = 0; s <= 72; s++) {
      const th = s / 72 * Math.PI * 2;
      const q = k + m * s / 72;
      const r = 3 + 6.5 * q + 0.12 * q * q;   // кольца сгущаются к центру, как в оригинале
      d += (s ? "L" : "M") + (r * Math.cos(th)).toFixed(1) + "," + (r * Math.sin(th)).toFixed(1);
    }
    p.setAttribute("d", d);
  });
}

  const t = fixedT ?? (reduce ? 7.5 : Math.min((now - start) / 1000, 9.45));
  const fr = t * 30;   // номер кадра исходника

  // контур: веко поднимается снизу вверх, потом опускается
  const { top, bot } = outlineAt(fr);
  const open = fr > 1 && fr < 191;
  $("eyes").setAttribute("opacity", open ? 1 : 0);
  $("outline").setAttribute("d", curve(top.concat(bot.slice(1, -1).reverse()), true));
  $("band").setAttribute("d", curve(top, false));

  // шаринган: томоэ медленно крутятся по часовой (~25°/с)
  $("tomoe").setAttribute("transform", `rotate(${25 + 25 * t})`);

  // кадры 88–99: зрачок белеет, радужка раздувается, белый диск заполняет глаз
  const w = seg(fr, 87, 90);
  $("pupil").setAttribute("fill", w > 0 ? "#fff" : "#1c0805");
  $("pupil").setAttribute("r", 5 + 4 * w);
  const grow = smooth(seg(fr, 91, 98));
  const scale = 1 + 2.0 * grow;
  $("iris").setAttribute("transform", `translate(204,653) scale(${scale})`);
  // белый диск в пикселях кадра: 6 -> 45 (кадр 95) -> 68 (кадр 98)
  const diskPx = w > 0 ? 6 * w + 39 * smooth(seg(fr, 91, 95)) + 23 * smooth(seg(fr, 95, 98)) : 0;
  $("disk").setAttribute("r", diskPx / scale);
  $("dot").setAttribute("opacity", w > 0 ? 1 : 0);

  // риннеган проступает из белого диска
  // риннеган раскрывается кругом из белого диска, красное остаётся по краям до ~101 кадра
  $("reveal").setAttribute("r", fr < 96 ? 0 : 60 * smooth(seg(fr, 96, 98)) + 70 * smooth(seg(fr, 98, 102)));
  const r = smooth(seg(fr, 99, 103));
  $("shar").setAttribute("opacity", fr < 103 ? 1 : 0);
  $("glow").setAttribute("opacity", 0.75 * r);
  $("innerGlow").setAttribute("opacity", 0.7 * r);
  $("rim").setAttribute("opacity", 1 - r);
  drawRings(smooth(seg(fr, 104, 140)));
  $("rings").setAttribute("transform", `translate(205,655) rotate(${-30 * Math.max(0, t - 3.4)})`);

  // кадры 201–212: слово проявляется из лёгкого размытия и чуть уменьшается
  const a = seg(fr, 201, 212);
  const word = $("word");
  word.setAttribute("opacity", a * (1 - seg(t, 9.0, 9.4)));
  word.setAttribute("transform", `translate(358,665) scale(${1.08 - 0.08 * smooth(a)}) translate(-358,-665)`);
  $("textBlurAmt").setAttribute("stdDeviation", 3 * (1 - a));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
